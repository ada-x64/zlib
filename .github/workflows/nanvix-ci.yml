# TEMP: Layer-3 exhaustion test. Replaces the real reusable-workflow
# wrapper with a minimal driver that exercises update-nanvix-version.sh
# directly. Restore from .github/workflows/nanvix-ci.real.yml.bak when done.
name: Nanvix CI

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  preflight-skip-test:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      LATEST_TAG: v99.99.99
      LATEST_VERSION: "99.99.99"
      MAX_RETRIES: "2"
      BACKOFF_BASE_SECONDS: "5"
      GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v6

      - name: Checkout workflows@fix/sync-failure-cascade
        uses: actions/checkout@v6
        with:
          repository: ada-x64/workflows
          ref: fix/sync-failure-cascade
          path: _workflows

      - name: Install nanvix-zutil
        run: pipx install nanvix-zutil || pip install --user nanvix-zutil

      - name: Run preflight (expected to skip with exit 0)
        run: bash _workflows/scripts/update-nanvix-version.sh
